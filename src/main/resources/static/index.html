<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Employees and Awards</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <!-- Include Bootstrap CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/css/bootstrap.min.css" integrity="sha384-Gn5384xqQ1aoWXA+058RXPxPg6fy4IWvTNh0E263XmFcJlSAwiGgFAW/dAiS6JXm" crossorigin="anonymous">

    <style>
        body {
            padding: 20px;
        }
    </style>
</head>
<body>
<div th:switch="${employees}" class="mt-5">
    <p th:case="null" class="alert alert-warning">No employees</p>
    <div th:case="*">
        <h2 class="mb-3">Employees</h2>
        <table class="table table-striped">
            <thead class="thead-dark">
            <tr>
                <th>First name</th>
                <th>Last name</th>
                <th>Dundie Awards</th>
                <th>Organization id</th>
                <th>Organization name</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="employee : ${employees}">
                <td th:text="${employee.firstName}"></td>
                <td th:text="${employee.lastName}"></td>
                <td th:text="${employee.dundieAwards}"></td>
                <td th:text="${employee.organization.id}"></td>
                <td th:text="${employee.organization.name}"></td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

<div th:if="${activities}" class="mt-5">
    <h2 class="mb-3">Activity Log</h2>

    <p th:if="${activities.totalElements > 0}" class="text-muted">
        <small th:text="'Total: ' + ${activities.totalElements} + ' activities (Page ' + (${activities.pageNumber} + 1) + ' of ' + ${activities.totalPages} + ')'" ></small>
    </p>

    <div th:if="${activities.content.size() > 0}">
        <table class="table table-striped">
            <thead class="thead-dark">
            <tr>
                <th>Occurred At</th>
                <th>Event</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="activity : ${activities.content}">
                <td th:text="${activity.formattedOccurredAt}"></td>
                <td>
                    <strong th:text="${activity.action}"></strong>
                    <br/>
                    <small th:text="${activity.methodReference}" class="text-muted"></small>
                </td>
            </tr>
            </tbody>
        </table>
    </div>

    <div th:if="${activities.content.size() == 0}" class="alert alert-info">
        No activities recorded yet.
    </div>

    <!-- Pagination Controls -->
    <nav th:if="${activities.totalPages > 1}" aria-label="Page navigation" class="mt-3">
        <ul class="pagination">
            <!-- Previous Page -->
            <li class="page-item" th:classappend="${!activities.hasPrevious} ? 'disabled' : ''">
                <a class="page-link" th:if="${activities.hasPrevious}" th:href="@{/(page=${activities.pageNumber - 1})}" aria-label="Previous">
                    <span aria-hidden="true">&laquo;</span> Previous
                </a>
                <span class="page-link" th:unless="${activities.hasPrevious}" aria-label="Previous">
                    <span aria-hidden="true">&laquo;</span> Previous
                </span>
            </li>

            <!-- Page Numbers -->
            <li class="page-item" th:each="pageNum : ${#numbers.sequence(0, activities.totalPages - 1)}"
                th:classappend="${pageNum == activities.pageNumber} ? 'active' : ''">
                <a class="page-link" th:if="${pageNum != activities.pageNumber}" th:href="@{/(page=${pageNum})}" th:text="${pageNum + 1}"></a>
                <span class="page-link" th:if="${pageNum == activities.pageNumber}" th:text="${pageNum + 1}"></span>
            </li>

            <!-- Next Page -->
            <li class="page-item" th:classappend="${!activities.hasNext} ? 'disabled' : ''">
                <a class="page-link" th:if="${activities.hasNext}" th:href="@{/(page=${activities.pageNumber + 1})}" aria-label="Next">
                    Next <span aria-hidden="true">&raquo;</span>
                </a>
                <span class="page-link" th:unless="${activities.hasNext}" aria-label="Next">
                    Next <span aria-hidden="true">&raquo;</span>
                </span>
            </li>
        </ul>
    </nav>
</div>

<div th:unless="${activities}" class="mt-5">
    <div class="alert alert-warning">No activity log data available</div>
</div>

<!-- Include Bootstrap JS and Popper.js -->
<script src="https://code.jquery.com/jquery-3.3.1.slim.min.js"
        integrity="sha384-q8i/X+965DzO0rT7abK41JStQIAqVgRVzpbzo5smXKp4YfRvH+8abtTE1Pi6jizo"
        crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.14.7/umd/popper.min.js"
        integrity="sha384-UO2eT0CpHqdSJQ6hJty5KVphtPhzWj9WO1clHTMGa3JDZwrnQq4sF86dIHNDz0W1"
        crossorigin="anonymous"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js"
        integrity="sha384-JjSmVgyd0p3pXB1rRibZUAYoIIy6OrQ6VrjIEaFf/nJGzIxFDsf4x0xIM+B07jRM"
        crossorigin="anonymous"></script>
</body>
</html>
